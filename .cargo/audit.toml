# `cargo audit` settings. Every ignored advisory says why it can't affect Clavren.
[advisories]
ignore = [
    # libsqlite3-sys (C SQLite): only listed in Cargo.lock because sqlx records its optional SQLite
    # driver there; Clavren enables only the `postgres` driver, so SQLite is never compiled
    # (`cargo tree -i libsqlite3-sys --target all` prints nothing). Drop this once sqlx-sqlite
    # allows libsqlite3-sys 0.39.
    "RUSTSEC-2026-0459",
]
