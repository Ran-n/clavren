[package]
name = "clavren-protocol"
description = "What the Clavren server and its clients must agree on: wire types, error codes, key format, challenge message and token claims"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
ed25519-dalek = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
