[package]
name = "clavren-server"
description = "Clavren licensing service: public activation API, admin API and dashboard, admin CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
# a bare `cargo run` runs the server; `cargo dev` (xtask) also sets up what it needs first
default-run = "clavren"

# The library is `clavren`, so log targets read `clavren::licences`, `clavren::http`…
[lib]
name = "clavren"

[[bin]]
name = "clavren"
path = "src/bin/clavren.rs"

[[bin]]
name = "clavren-admin"
path = "src/bin/clavren_admin.rs"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clavren-protocol = { path = "../clavren-protocol" }
ed25519-dalek = "3.0.0"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
qrcode = "0.14.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "sync"] }
tokio-util = "0.7.20"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "request-id", "util", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
