# Formatting, lints, tests and the dashboard's type check on every push, on Codeberg (Forgejo
# Actions: enable Actions in the repository's settings first). The steps are in scripts/ci.sh,
# shared with GitHub and GitLab.
on:
  push:
  pull_request:
  # Run workflow on the Actions page, to check again without a push
  workflow_dispatch:
jobs:
  checks:
    runs-on: codeberg-medium
    # Full image names: Codeberg's runner pulls a short name, then can't find it to start it
    container:
      image: docker.io/library/rust:1.99-bookworm
    services:
      postgres:
        image: docker.io/library/postgres:17
        env:
          # the user the tests expect (.cargo/config.toml), a superuser so sqlx::test can create databases
          POSTGRES_USER: clavren_local
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      DATABASE_URL: postgres://clavren_local@postgres:5432/postgres
    steps:
      # actions/checkout runs on Node, which the Rust image doesn't have; the repository is public
      - name: checkout
        run: |
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: bash scripts/ci-setup.sh
      - run: bash scripts/ci.sh
